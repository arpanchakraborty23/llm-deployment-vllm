# =============================================================================
# Prometheus Configuration — LiteLLM Proxy
# =============================================================================
# Scrapes LiteLLM metrics from the proxy and optionally from vLLM backends.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "litellm"
    static_configs:
      - targets: ["litellm-db:4000"]
    metrics_path: /metrics

  # Uncomment to scrape vLLM directly if running alongside
  # - job_name: "vllm"
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]
  #   metrics_path: /metrics
