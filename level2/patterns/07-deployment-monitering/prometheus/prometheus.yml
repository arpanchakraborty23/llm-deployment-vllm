global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
    metrics_path: /metrics
    # vLLM exposes Prometheus-formatted metrics at /metrics
    # Includes: request throughput, token counts, latency histograms,
    # GPU cache usage, active requests, and scheduler stats.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
