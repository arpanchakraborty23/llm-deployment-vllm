# =============================================================================
# Level 3: Nginx Gateway Deployment
# vLLM + Nginx Reverse Proxy + Prometheus + Grafana
# =============================================================================
#
# START: docker compose up -d
# STOP:  docker compose down
# URLS:
#   - vLLM API (via Nginx): http://localhost/v1/models
#   - vLLM API (direct):    http://localhost:8000/v1/models
#   - Prometheus:           http://localhost:9090
#   - Grafana:              http://localhost:3001  (admin / admin)
# =============================================================================

services:

  # ===========================================================================
  # Nginx — Reverse Proxy / API Gateway
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Set this to enable API key auth: Authorization: Bearer <key>
      # Leave empty to allow all requests (no auth).
      NGINX_API_KEY: ${NGINX_API_KEY:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache gettext >/dev/null 2>&1
        envsubst '${NGINX_API_KEY}' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - llm-net

  # ===========================================================================
  # vLLM — The Inference Engine (internal, not directly exposed)
  # ===========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: llm-vllm
    restart: unless-stopped
    # No host port mapping — vLLM is only reachable via Nginx
    # Expose is only for inter-container communication
    expose:
      - "8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NGINX_API_KEY=djklkwqem,g4g4;lkkjkj
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16g
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-0.6B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--max-model-len"
      - "4096"
      - "--enable-prefix-caching"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - llm-net

  # ===========================================================================
  # Prometheus — Metrics Scraper
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - llm-net

  # ===========================================================================
  # Grafana — Metrics Dashboard
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: llm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - llm-net

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  hf-cache:
  prometheus-data:
  grafana-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  llm-net:
    driver: bridge
