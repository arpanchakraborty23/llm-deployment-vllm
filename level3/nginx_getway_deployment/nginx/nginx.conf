# =============================================================================
# Nginx Configuration — vLLM Reverse Proxy
# =============================================================================
# Features:
#   - Reverse proxy for /v1/* OpenAI-compatible API endpoints
#   - Health check passthrough
#   - Rate limiting per client IP
#   - Optional API key validation (Authorization: Bearer <key>)
#   - Request/response buffering for streaming
#   - Metrics passthrough for Prometheus scraping
# =============================================================================

events {
    worker_connections 1024;
}

http {

    # ------------------------------------------------------------------
    # Rate Limiting Zones
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=completion_limit:10m rate=20r/m;

    # ------------------------------------------------------------------
    # API Key Extraction
    # ------------------------------------------------------------------
    # Parses the Bearer token from the Authorization header.
    # Set NGINX_API_KEY env var in compose.yml to enable auth.
    # When NGINX_API_KEY is empty/omitted, all requests pass through.
    # ------------------------------------------------------------------
    map $http_authorization $api_key {
        default "";
        "~^Bearer\s+(.+)$" $1;
    }

    # ------------------------------------------------------------------
    # Upstream — vLLM Inference Server
    # ------------------------------------------------------------------
    upstream vllm_backend {
        server vllm:8000 max_fails=3 fail_timeout=30s;

        # Add replicas for load balancing:
        # server vllm-2:8000 max_fails=3 fail_timeout=30s;
        # keepalive 32;
    }

    # ------------------------------------------------------------------
    # Server — HTTP
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # --------------------------------------------------------------
        # Global proxy settings
        # --------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        client_max_body_size 10m;

        # --------------------------------------------------------------
        # API Key Verification (applied to all /v1/* locations)
        # --------------------------------------------------------------
        # $expected_api_key is injected at container start via envsubst.
        # If empty, auth is disabled. If set, only matching Bearer tokens
        # are allowed.
        # --------------------------------------------------------------
        set $expected_api_key "${NGINX_API_KEY}";
        set $unauthorized 0;

        if ($expected_api_key != "") {
            set $unauthorized 1;
        }
        if ($api_key = $expected_api_key) {
            set $unauthorized 0;
        }

        # --------------------------------------------------------------
        # Health Check (no auth required, internal only)
        # --------------------------------------------------------------
        location /health {
            proxy_pass http://vllm_backend/health;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }

        # --------------------------------------------------------------
        # OpenAI Chat Completions (compute-heavy)
        # --------------------------------------------------------------
        location /v1/chat/completions {
            limit_req zone=completion_limit burst=5 nodelay;

            if ($unauthorized) {
                return 401 "{\"error\":\"Unauthorized\",\"message\":\"Invalid or missing API key. Send Authorization: Bearer <key> header.\"}";
            }

            proxy_pass http://vllm_backend/v1/chat/completions;
            proxy_set_header X-Accel-Buffering no;
        }

        # --------------------------------------------------------------
        # OpenAI Text Completions (compute-heavy)
        # --------------------------------------------------------------
        location /v1/completions {
            limit_req zone=completion_limit burst=5 nodelay;

            if ($unauthorized) {
                return 401 "{\"error\":\"Unauthorized\",\"message\":\"Invalid or missing API key.\"}";
            }

            proxy_pass http://vllm_backend/v1/completions;
            proxy_set_header X-Accel-Buffering no;
        }

        # --------------------------------------------------------------
        # OpenAI API — Other endpoints (models, embeddings, etc.)
        # --------------------------------------------------------------
        location /v1/ {
            limit_req zone=api_limit burst=10 nodelay;

            if ($unauthorized) {
                return 401 "{\"error\":\"Unauthorized\",\"message\":\"Invalid or missing API key.\"}";
            }

            proxy_pass http://vllm_backend/v1/;
        }

        # --------------------------------------------------------------
        # Prometheus Metrics (no auth, internal only)
        # --------------------------------------------------------------
        location /metrics {
            proxy_pass http://vllm_backend/metrics;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }

        # --------------------------------------------------------------
        # Fallback
        # --------------------------------------------------------------
        location / {
            return 404;
        }
    }
}
